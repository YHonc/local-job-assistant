[project]
name = "local-job-assistant"
version = "0.1.0"
description = "Local-first job application workbench with browser capture and email tracking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "alembic>=1.13",
  "jinja2>=3.1",
  "litellm>=1.75,<2",
  "httpx[socks]>=0.28.1,<1",
  "keyring>=25,<26",
  "imap-tools>=1.7,<2",
  "apscheduler>=3.10,<4",
  "apprise>=1.9,<2",
  "pywin32>=306; platform_system == 'Windows'",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 本机 %TEMP%\pytest-of-<user> 与项目 .pytest_cache 曾因权限损坏导致 pytest 无法启动；
# 这里固定使用项目内临时目录并关闭 cache provider，使测试不依赖系统临时目录状态。
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"
